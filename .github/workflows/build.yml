name: Build and Release

on:
  push:
    branches: [ main ]
    paths:
      - 'filament_manager/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'filament_manager/**'
      - '.github/workflows/**'
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            platform: windows
            build-command: flutter build windows --release
            artifact-name: filament-manager-windows
            artifact-path: build/windows/x64/runner/Release/
            executable: filament_manager.exe
          - os: ubuntu-latest
            platform: android
            build-command: flutter build apk --release
            artifact-name: filament-manager-android
            artifact-path: build/app/outputs/flutter-apk/
            executable: app-release.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('filament_manager/pubspec.lock') }}

      - name: Install dependencies
        run: cd filament_manager && flutter pub get

      - name: Verify Flutter installation
        run: cd filament_manager && flutter doctor -v

      - name: Run tests
        run: cd filament_manager && flutter test

      - name: Build application
        run: cd filament_manager && ${{ matrix.build-command }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: filament_manager/${{ matrix.artifact-path }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: filament-manager-windows
          path: ./windows-artifact

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: filament-manager-android
          path: ./android-artifact

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./windows-artifact/filament_manager.exe
            ./android-artifact/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}